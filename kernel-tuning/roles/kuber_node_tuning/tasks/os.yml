---
# --- swap off, persistently (kubelet failSwapOn=true) ---
- name: Disable swap now
  ansible.builtin.command: swapoff -a
  changed_when: true
  when: ansible_swaptotal_mb | int > 0

- name: Comment out swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n]\S*\s+\S+\s+swap\s.*)$'
    replace: '# \1'

# --- time sync ---
- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Set chrony service name
  ansible.builtin.set_fact:
    chrony_service: "{{ 'chrony' if ansible_os_family == 'Debian' else 'chronyd' }}"

- name: Chrony drop-in directory
  ansible.builtin.file:
    path: /etc/chrony/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_os_family == 'Debian'

- name: Chrony drop-in
  ansible.builtin.copy:
    dest: /etc/chrony/conf.d/90-k8s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # step the clock if the offset is > 1s during the first 3 updates (fresh/resumed VMs)
      makestep 1.0 3
      {% for s in chrony_servers %}
      server {{ s }} iburst
      {% endfor %}
  when: ansible_os_family == 'Debian'
  notify: Restart chrony

- name: Enable and start chrony
  ansible.builtin.systemd_service:
    name: "{{ chrony_service }}"
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode

# --- journald size limits ---
- name: Journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Journald limits
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/90-k8s.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

# --- login-session ulimits (PAM only; services use the systemd limits in limits.yml) ---
- name: Login-session file descriptor limits
  ansible.builtin.copy:
    dest: /etc/security/limits.d/90-k8s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      *    soft nofile 65536
      *    hard nofile 1048576
      root soft nofile 65536
      root hard nofile 1048576
