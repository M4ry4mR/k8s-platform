# Single control plane (stacked etcd) + 2 workers, libvirt VMs.
# SSH user: devops (created by cloud-init, passwordless sudo).

[all:vars]
ansible_user=devops
ansible_become=true
ansible_ssh_private_key_file=~/.ssh/k8s-platform
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'

[kube_control_plane]
k8s-cp ansible_host=192.168.122.10 ip=192.168.122.10 etcd_member_name=etcd1

[etcd:children]
kube_control_plane

[kube_node]
k8s-worker-1 ansible_host=192.168.122.11 ip=192.168.122.11
k8s-worker-2 ansible_host=192.168.122.12 ip=192.168.122.12

[k8s_cluster:children]
kube_control_plane
kube_node