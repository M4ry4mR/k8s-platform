apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-content
  namespace: demo

data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Kubernetes Demo</title>
    </head>
    <body>
      <h1>Kubernetes Platform Demo</h1>

      <p><strong>Application:</strong> demo-nginx</p>
      <p><strong>Version:</strong> 1.0.0</p>
      <p><strong>Status:</strong> OK</p>
      <p><strong>Platform:</strong> Kubernetes</p>
    </body>
    </html>

  nginx.conf: |
    worker_processes auto;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      sendfile on;
      keepalive_timeout 65;

      server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
          try_files $uri $uri/ =404;
        }
      }
    }